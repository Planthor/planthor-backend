name: Docker CI workflow

on:
  push:
    branches: ["main"]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: ["main"]
    types:
      - opened
      - reopened
      - synchronize

jobs:
  docker-build:
    runs-on: ubuntu-latest
    name: Build and publish backend image
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Set up Cloud SDK
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GOOGLE_PROJECT }}

      - name: Configure Artifact Registry Docker authentication
        if: github.event_name != 'pull_request'
        run: gcloud auth configure-docker "${{ secrets.GOOGLE_REGION }}-docker.pkg.dev" --quiet

      - name: Define Artifact Registry image URIs
        id: image
        env:
          REGISTRY_HOST: ${{ secrets.GOOGLE_REGION }}-docker.pkg.dev
          PROJECT_ID: ${{ secrets.GOOGLE_PROJECT }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            REPOSITORY="planthor-backend"
          else
            REPOSITORY="${REGISTRY_HOST}/${PROJECT_ID}/planthor-backend/planthor-backend"
          fi
          echo "immutable=${REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${REPOSITORY}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Artifact Registry image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.immutable }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


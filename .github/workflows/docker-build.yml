name: Docker CI workflow

on:
  push:
    branches: ["main"]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: ["main"]
    types:
      - opened
      - reopened
      - synchronize

jobs:
  docker-build:
    runs-on: ubuntu-latest
    name: Build and publish backend image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Set up Cloud SDK
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ secrets.GOOGLE_PROJECT }}

      - name: Configure Artifact Registry Docker authentication
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_HOST: ${{ secrets.GOOGLE_REGION }}-docker.pkg.dev
        run: gcloud auth configure-docker "$REGISTRY_HOST" --quiet

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: planthordev
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define container image URIs
        id: image
        env:
          REGISTRY_HOST: ${{ secrets.GOOGLE_REGION }}-docker.pkg.dev
          PROJECT_ID: ${{ secrets.GOOGLE_PROJECT }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            {
              echo "tags<<EOF"
              echo "planthor-backend:${GITHUB_SHA}"
              echo "planthor-backend:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "${REGISTRY_HOST}/${PROJECT_ID}/planthor-backend/planthor-backend:${GITHUB_SHA}"
              echo "${REGISTRY_HOST}/${PROJECT_ID}/planthor-backend/planthor-backend:latest"
              echo "planthordev/planthor-backend:${GITHUB_SHA}"
              echo "planthordev/planthor-backend:latest"
              echo "ghcr.io/planthor/webapi:${GITHUB_SHA}"
              echo "ghcr.io/planthor/webapi:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push container images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
